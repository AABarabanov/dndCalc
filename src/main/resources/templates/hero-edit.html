<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редактирование героя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>✏️ Редактирование: <span th:text="${hero.name}">Имя героя</span></h1>

  <form th:action="@{/heroes/{id}/edit(id=${hero.id})}" th:object="${hero}" method="post" class="mt-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="row">

      <!-- Левая колонка - текущие данные -->

      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5>📋 Текущие данные</h5>
          </div>
          <div class="card-body">
            <table class="table">
              <tr>
                <th>Имя:</th>
                <td th:text="${hero.name}">-</td>
              </tr>
              <tr>
                <th>Раса:</th>
                <td th:text="${hero.race}">-</td>
              </tr>
              <tr>
                <th>Класс:</th>
                <td th:text="${hero.heroClass}">-</td>
              </tr>
              <tr>
                <th>Уровень:</th>
                <td th:text="${hero.level}">-</td>
              </tr>
              <tr>
                <th>КЗ:</th>
                <td th:text="${hero.defenceClass}">-</td>
              </tr>
              <tr>
                <th>Атака:</th>
                <td th:text="${hero.attackCheck}">-</td>
              </tr>
              <tr>
                <th>Урон:</th>
                <td th:text="${hero.damageByHero}">-</td>
              </tr>
              <tr>
                <th>Грузоподъемность:</th>
                <td th:text="${hero.loadCapacity}">-</td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <!-- Правая колонка - поля для редактирования -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5>🛠️ Редактирование</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="name" class="form-label">Имя героя *</label>
              <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>

            <div class="mb-3">
              <label for="race" class="form-label">Раса</label>
              <input type="text" class="form-control" id="race" th:field="*{race}">
            </div>

            <div class="mb-3">
              <label for="heroClass" class="form-label">Класс</label>
              <input type="text" class="form-control" id="heroClass" th:field="*{heroClass}">
            </div>

            <div class="mb-3">
              <label for="level" class="form-label">Уровень</label>
              <input type="number" class="form-control" id="level" th:field="*{level}">
            </div>

            <div class="mb-3">
              <label for="defenceClass" class="form-label">Класс защиты (КЗ)</label>
              <input type="number" class="form-control" id="defenceClass" th:field="*{defenceClass}">
            </div>

            <div class="mb-3">
              <label for="attackCheck" class="form-label">Проверка атаки</label>
              <input type="number" class="form-control" id="attackCheck" th:field="*{attackCheck}">
            </div>

            <div class="mb-3">
              <label for="damageByHero" class="form-label">Урон</label>
              <input type="text" class="form-control" id="damageByHero" th:field="*{damageByHero}">
            </div>

            <div class="mb-3">
              <label for="loadCapacity" class="form-label">Грузоподъемность (кг)</label>
              <input type="number" class="form-control" id="loadCapacity" th:field="*{loadCapacity}">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
      <a href="/heroes" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>
</body>
</html>
