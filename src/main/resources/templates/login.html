<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Вход — dndCalc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
      }

      .login-card {
          background: rgba(255, 255, 255, 0.95);
          border-radius: 20px;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
          overflow: hidden;
      }

      .login-header {
          background: linear-gradient(45deg, #f7971e, #ffd200);
          padding: 20px;
          text-align: center;
          color: #1a1a2e;
      }

      .login-body {
          padding: 30px;
      }

      .btn-login {
          background: linear-gradient(45deg, #f7971e, #ffd200);
          border: none;
          font-weight: bold;
          padding: 12px;
          border-radius: 50px;
          width: 100%;
          transition: transform 0.2s;
      }

      .btn-login:hover {
          transform: scale(1.02);
      }

      .dice-icon {
          font-size: 3rem;
      }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="login-card">
        <div class="login-header">
          <div class="dice-icon">🎲</div>
          <h2 class="mb-0">dndCalc</h2>
          <p class="mb-0">Войдите в аккаунт</p>
        </div>
        <div class="login-body">

          <div th:if="${param.registered}" class="alert alert-success" role="alert">
            ✅ Регистрация успешна! Теперь войдите в систему.
          </div>

          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            ❌ Неверное имя пользователя или пароль
          </div>

          <div th:if="${param.logout}" class="alert alert-info" role="alert">
            👋 Вы вышли из системы
          </div>

          <!-- Форма входа -->
          <form method="post" action="/login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label for="username" class="form-label">Имя пользователя</label>
              <input type="text" class="form-control" id="username" name="username"
                     required autofocus placeholder="Введите ваше имя">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="password" name="password"
                     required placeholder="Введите пароль">
            </div>

            <button type="submit" class="btn btn-login mt-2">
              🔐 Войти
            </button>
          </form>

          <hr class="my-4">

          <p class="text-center mb-0">
            Нет аккаунта? <a href="/register" class="text-decoration-none">Зарегистрироваться →</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
