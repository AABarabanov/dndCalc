<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Мои герои — dndCalc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          min-height: 100vh;
      }

      .hero-card {
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.2);
          transition: transform 0.2s;
          cursor: pointer;
      }

      .hero-card:hover {
          transform: translateY(-5px);
          background: rgba(255, 255, 255, 0.15);
      }

      .btn-create {
          background: linear-gradient(45deg, #f7971e, #ffd200);
          border: none;
          font-weight: bold;
      }

      .empty-state {
          text-align: center;
          padding: 50px;
          background: rgba(255, 255, 255, 0.05);
          border-radius: 20px;
      }
  </style>
</head>
<body>

<div class="container py-4">

  <div th:replace="~{fragments/header :: userMenu}"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="text-white">⚔️ Мои герои</h1>
    <a th:href="@{/heroes/new}" class="btn btn-create btn-lg">
      ➕ Создать героя
    </a>
  </div>

  <!-- Список героев -->
  <div th:if="${heroes != null and !heroes.isEmpty()}">
    <div class="row">
      <div class="col-md-6 col-lg-4 mb-4" th:each="hero : ${heroes}">
        <div class="card hero-card h-100"
             th:onclick="|location.href='/heroes/' + ${hero.id}|">
          <div class="card-body text-white">
            <h3 class="card-title" th:text="${hero.name}">Имя героя</h3>
            <div class="mt-2 mb-3">
              <span class="badge bg-secondary me-1" th:text="${hero.race}">Раса</span>
              <span class="badge bg-primary" th:text="${hero.heroClass}">Класс</span>
            </div>
            <hr class="bg-light">
            <div class="row small">
              <div class="col-6">
                <span>🛡️ КЗ</span><br>
                <strong th:text="${hero.defenceClass}">10</strong>
              </div>
              <div class="col-6">
                <span>⚔️ Атака</span><br>
                <strong>+<span th:text="${hero.attackCheck}">0</span></strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Пустое состояние -->
  <div th:if="${heroes == null or heroes.isEmpty()}" class="empty-state">
    <h3 class="text-white">😢 У вас пока нет героев</h3>
    <p class="text-light">Создайте своего первого персонажа для приключений!</p>
    <a th:href="@{/heroes/new}" class="btn btn-create btn-lg mt-3">
      🎲 Создать первого героя
    </a>
  </div>
</div>

</body>
</html>
